# ─── GitHub Actions CI/CD ──────────────────────────────────────────────────────
# Production gates for pushes to main/perez and pull requests into main.
# CI must fail closed: lint, type-check, tests, build and browser smoke tests
# are required before a change is considered releasable.

name: CI

on:
  push:
    branches: [main, perez]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — quality and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Generate Prisma client
        run: npx prisma generate --schema=./prisma/schema.prisma
      - name: Lint
        # Existing code carries a large warning-only ESLint backlog. Keep errors fail-closed
        # while using an explicit budget until that debt is systematically reduced.
        run: npm run lint:check -- --max-warnings=1500
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Prepare test database
        run: npx prisma db push --schema=./prisma/schema.prisma
        env:
          NODE_ENV: test
          DATABASE_URL: file:./prisma/test.db
          JWT_SECRET: ci-kampstock-${{ github.run_id }}-jwt-secret-2026
          JWT_REFRESH_SECRET: ci-kampstock-${{ github.run_id }}-refresh-secret-2026
          CSRF_SECRET: ci-kampstock-${{ github.run_id }}-csrf-secret-2026
      - name: Unit tests
        run: npm run test -- --runInBand --no-coverage
        env:
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-min!!
          DATABASE_URL: file:./prisma/test.db
          CSRF_SECRET: ci-csrf-secret-value

  backend-postgres:
    name: Backend — PostgreSQL integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kampstock
          POSTGRES_PASSWORD: kampstock
          POSTGRES_DB: kampstock_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U kampstock -d kampstock_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generate PostgreSQL Prisma client
        run: npx prisma generate --schema=./prisma-pg/schema.prisma
        env:
          DATABASE_URL: postgresql://kampstock:kampstock@127.0.0.1:5432/kampstock_test
      - name: Apply versioned PostgreSQL migrations
        run: npx prisma migrate deploy --schema=./prisma-pg/schema.prisma
        env:
          DATABASE_URL: postgresql://kampstock:kampstock@127.0.0.1:5432/kampstock_test
      - name: TypeScript check against PostgreSQL client
        run: npx tsc --noEmit
        env:
          DATABASE_URL: postgresql://kampstock:kampstock@127.0.0.1:5432/kampstock_test

      - name: Backend tests against PostgreSQL
        run: npm run test -- --runInBand --no-coverage
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://kampstock:kampstock@127.0.0.1:5432/kampstock_test
          JWT_SECRET: ci-postgres-jwt-secret-32-characters-minimum
          JWT_REFRESH_SECRET: ci-postgres-refresh-secret-32-minimum
          CSRF_SECRET: ci-postgres-csrf-secret-32-characters-minimum
  frontend:
    name: Frontend — quality and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build
        run: npm run build

  e2e:
    name: E2E — Playwright smoke tests
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci
      - name: Prepare test database
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma db push
          npx prisma db seed
        env:
          NODE_ENV: test
          DATABASE_URL: file:./prisma/test.db
          JWT_SECRET: ci-kampstock-${{ github.run_id }}-jwt-secret-2026
          JWT_REFRESH_SECRET: ci-kampstock-${{ github.run_id }}-refresh-secret-2026
          CSRF_SECRET: ci-kampstock-${{ github.run_id }}-csrf-secret-2026
      - name: Build backend
        working-directory: backend
        run: npm run build
      - name: Start backend
        working-directory: backend
        run: node dist/main.js > /tmp/kampstock-api.log 2>&1 &
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: file:./prisma/test.db
          JWT_SECRET: ci-kampstock-${{ github.run_id }}-jwt-secret-2026
          JWT_REFRESH_SECRET: ci-kampstock-${{ github.run_id }}-refresh-secret-2026
          CSRF_SECRET: ci-kampstock-${{ github.run_id }}-csrf-secret-2026
          ALLOWED_ORIGINS: http://127.0.0.1:5173
      - name: Wait for backend
        run: npx wait-on http://127.0.0.1:3000/api/health --timeout 30000
      - name: Verify seeded authentication endpoint
        run: |
          curl --fail-with-body -sS -c /tmp/kampstock-cookies \
            -H 'Content-Type: application/json' \
            -d '{"username":"manager","password":"manager123"}' \
            http://127.0.0.1:3000/api/auth/login
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Build production bundle
        run: npm run build
        env:
          VITE_API_URL: http://127.0.0.1:3000/api
      - name: Start Vite preview server
        run: |
          npm run preview -- --host 127.0.0.1 --port 5173 &
          npx wait-on http://127.0.0.1:5173 --timeout 30000
      - name: Run E2E tests
        run: npx playwright test --project=chromium
        env:
          E2E_BASE_URL: http://127.0.0.1:5173
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  docker:
    name: Docker — production images
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          tags: kampstock/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: false
          tags: kampstock/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
