# ─── GitHub Actions CI/CD ──────────────────────────────────────────────────────
# Runs on every push to main and perez branches, and on pull requests to main.
# Steps: install → lint/tsc → test → (on main push) build Docker images.

name: CI

on:
  push:
    branches: [main, perez]
  pull_request:
    branches: [main]

jobs:
  # ── Backend: lint, type-check, unit tests ──────────────────────────────────
  backend:
    name: Backend — test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client (SQLite for tests)
        run: npx prisma generate --schema=./prisma/schema.prisma

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Unit tests (no coverage)
        run: npm run test -- --no-coverage
        env:
          JWT_SECRET: ci-test-secret-32-chars-minimum!!
          JWT_REFRESH_SECRET: ci-refresh-secret-32-chars-min!!
          DATABASE_URL: file:./prisma/test.db
          CSRF_SECRET: ci-csrf-secret-value

  # ── Frontend: type-check + build ──────────────────────────────────────────
  frontend:
    name: Frontend — build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ── Docker build (only on push to main) ───────────────────────────────────
  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          target: production
          push: false
          tags: kampstock/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          target: production
          push: false
          tags: kampstock/frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── E2E smoke tests (Playwright, Chromium only) ───────────────────────────
  e2e:
    name: E2E — Playwright smoke tests
    runs-on: ubuntu-latest
    needs: [frontend]
    # Only run on pushes (not PRs) to reduce CI cost; adjust as needed
    if: github.event_name == 'push'

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium browser
        run: npx playwright install --with-deps chromium

      - name: Start Vite preview server (production build)
        run: |
          npm run build
          npm run preview -- --port 5173 &
          npx wait-on http://localhost:5173 --timeout 30000

      - name: Run E2E tests (no live backend — offline/UI-only tests)
        run: npx playwright test --project=chromium
        env:
          # Point to the preview server; skip tests that need a running backend
          E2E_BASE_URL: http://localhost:5173
        # Don't fail the whole CI pipeline if E2E tests fail in preview-only mode
        # (backend not started). Remove continue-on-error once full stack E2E is ready.
        continue-on-error: true

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
