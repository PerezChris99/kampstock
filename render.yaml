# render.yaml — Infrastructure-as-Code for KampStock on Render.com
# Docs: https://render.com/docs/infrastructure-as-code
#
# Deployment steps:
#   1. Create a free account at https://render.com
#   2. Connect your GitHub repo (PerezChris99/kampstock)
#   3. Click "New Blueprint" and Render will auto-detect this file
#   4. Set ALLOWED_ORIGINS to your Vercel frontend URL once Vercel is deployed
#   5. After first deploy, open Render Shell and run: npm run db:seed

services:
  - type: web
    name: kampstock-api
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npx prisma db push && npm run build
    startCommand: node dist/main
    healthCheckPath: /api/health/ready
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kampstock-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: ALLOWED_ORIGINS
        # UPDATE THIS after deploying to Vercel — use your actual Vercel URL
        # e.g. https://kampstock.vercel.app or https://kampstock-perezchris99.vercel.app
        value: https://kampstock.vercel.app

databases:
  - name: kampstock-db
    plan: free
    databaseName: kampstock
    user: kampstock_user
